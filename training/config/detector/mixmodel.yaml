model_name: fsbi
#finetune_path: logs/training/fsbi/fsbi_2025-02-05-20-57-18_89.87_res380+effnetb4+adam+linear/test/Celeb-DF-v2/ckpt_best.pth

backbone_name: mixmodel

#backbone setting
backbone_config:
  model_1:
    mode: original
    num_classes: 2
    inc: 3
    dropout: false
  model_2:
    mode: original
    num_classes: 2
    inc: 3
    dropout: false
    pretrained_path: ./training/pretrained/efficientnet-b4-6ed6700e.pth
  freeze_finetune_path_1: logs/training/fsbi/fsbi_2025-02-05-20-57-18_89.87_res380+effnetb4+adam+linear/test/Celeb-DF-v2/ckpt_best.pth
  num_classes: 2

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
#test_dataset: [Celeb-DF-v2, roop, FaceShifter]
test_dataset: [Celeb-DF-v2]
#dataset_type: blend

compression: c23  # compression-level for videos
train_batchSize: 64   # training batch size
test_batchSize: 32   # test batch size
workers: 8   # number of data loading workers
frame_num: {'train': 8, 'test': 32}   # number of frames to use per video in training and testing
resolution: 380   # resolution of output image to network
with_mask: false   # whether to include mask information in the input
with_landmark: true   # whether to include facial landmark information in the input
save_ckpt: true   # whether to save checkpoint
save_feat: true   # whether to save features


# data augmentation
use_data_augmentation: false  # Add this flag to enable/disable data augmentation
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# mean and std for normalization
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# optimizer config
optimizer:
  # choose between 'adam' and 'sgd'
  type: adam
  adam:
    lr: 0.0002  # learning rate
    beta1: 0.9  # beta1 for Adam optimizer
    beta2: 0.999 # beta2 for Adam optimizer
    eps: 0.00000001  # epsilon for Adam optimizer
    weight_decay: 0.0005  # weight decay for regularization
    amsgrad: false
  sgd:
    lr: 0.0002  # learning rate
    momentum: 0.9  # momentum for SGD optimizer
    weight_decay: 0.0005  # weight decay for regularization
  sam:
    lr: 0.001  # learning rate
    momentum: 0.9  # momentum for SGD optimizer

# training config
#lr_scheduler: step   # learning rate scheduler step
lr_scheduler: linear
lr_step: 3
lr_gamma: 0.4   # learning rate scheduler
nEpochs: 20   # number of epochs to train for
start_epoch: 0   # manual epoch number (useful for restarts)
save_epoch: 1   # interval epochs for saving models
rec_iter: 100   # interval iterations for recording
logdir: ./logs   # folder to output images and logs
manualSeed: 1024   # manual seed for random number generation


# loss function
loss_func: cross_entropy   # loss function to use
losstype: null

# metric
metric_scoring: auc   # metric for evaluation (auc, acc, eer, ap)

# cuda

cuda: true   # whether to use CUDA acceleration
cudnn: true   # whether to use CuDNN for convolution operations
