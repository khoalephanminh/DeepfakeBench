# t-SNE config
n_components: 2
perplexities: [10, 15, 20, 25, 30] # default 30
n_iter: 2000
learning_rate: 200
method: fft # "fft", "barnes_hut" or "exact" (default "fft")
# "exact" chay sieu lau, ko nen thu
metric: cosine # ["l1", "cityblock", "manhattan", "euclidean", "l2", "sqeuclidean", "minkowski", "chebyshev", "cosine", "correlation"] (default "euclidean")
random_state: 1024

