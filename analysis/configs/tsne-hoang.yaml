# dataset config
compression: c23
test_batchSize: 32
workers: 8
frame_num: {'test': 32}
test_dataset: Celeb-DF-v2
test_dataset: FaceForensics++ # [FF-F2F, FF-DF, FF-FS, FF-NT]
#label_dict: {'CelebDFv2_real': 0, 'CelebDFv2_fake': 1}
label_dict: {'FF-real': 0, 'FF-DF': 1, 'FF-F2F': 2, 'FF-FS': 3, 'FF-NT': 4}
resolution: 380
with_mask: False
with_landmark: False

# misc
cuda: True
cudnn: True
loss_func: cross_entropy
dataset_json_folder: preprocessing/dataset_json
rgb_dir: datasets/rgb
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]